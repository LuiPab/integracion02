<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <defs>
    <style>
      .entity-box { fill: #e1f5ff; stroke: #0277bd; stroke-width: 2; }
      .entity-title { fill: #0277bd; font-weight: bold; font-size: 14px; }
      .entity-text { fill: #333; font-size: 12px; }
      .relationship { stroke: #d32f2f; stroke-width: 2; fill: none; }
      .relationship-label { fill: #d32f2f; font-size: 11px; font-weight: bold; }
      .cardinality { fill: #d32f2f; font-size: 12px; font-weight: bold; }
      .fk-indicator { fill: #f57c00; font-size: 10px; }
      .pk-indicator { fill: #388e3c; font-size: 10px; }
    </style>
  </defs>

  <!-- Título -->
  <text x="700" y="30" style="font-size: 24px; font-weight: bold; text-anchor: middle; fill: #0d47a1;">
    Diagrama Entidad-Relación: Sistema de Gestión de Libros
  </text>

  <!-- TABLA: USUARIOS -->
  <rect x="50" y="80" width="200" height="140" class="entity-box"/>
  <rect x="50" y="80" width="200" height="25" fill="#0277bd"/>
  <text x="150" y="100" style="fill: white; font-weight: bold; text-anchor: middle; font-size: 13px;">USUARIOS</text>
  <text x="60" y="120" class="pk-indicator">🔑 id_usuario (UUID)</text>
  <text x="60" y="135" class="entity-text">nombre (VARCHAR)</text>
  <text x="60" y="150" class="entity-text">email (VARCHAR) UK</text>
  <text x="60" y="165" class="entity-text">contraseña_hash</text>
  <text x="60" y="180" class="entity-text">es_administrador</text>
  <text x="60" y="195" class="entity-text">activo (BOOLEAN)</text>
  <text x="60" y="210" class="entity-text">created_at, updated_at</text>

  <!-- TABLA: LIBROS -->
  <rect x="350" y="80" width="220" height="140" class="entity-box"/>
  <rect x="350" y="80" width="220" height="25" fill="#0277bd"/>
  <text x="460" y="100" style="fill: white; font-weight: bold; text-anchor: middle; font-size: 13px;">LIBROS</text>
  <text x="360" y="120" class="pk-indicator">🔑 id_libro (UUID)</text>
  <text x="360" y="135" class="entity-text">isbn (VARCHAR) UK</text>
  <text x="360" y="150" class="entity-text">título (VARCHAR)</text>
  <text x="360" y="165" class="entity-text">year_publicación</text>
  <text x="360" y="180" class="entity-text">precio, stock</text>
  <text x="360" y="195" class="fk-indicator">🔗 id_formato (FK)</text>
  <text x="360" y="210" class="entity-text">descripción</text>

  <!-- TABLA: AUTORES -->
  <rect x="700" y="80" width="200" height="140" class="entity-box"/>
  <rect x="700" y="80" width="200" height="25" fill="#0277bd"/>
  <text x="800" y="100" style="fill: white; font-weight: bold; text-anchor: middle; font-size: 13px;">AUTORES</text>
  <text x="710" y="120" class="pk-indicator">🔑 id_autor (INT)</text>
  <text x="710" y="135" class="entity-text">nombre (VARCHAR)</text>
  <text x="710" y="150" class="entity-text">apellido (VARCHAR)</text>
  <text x="710" y="165" class="entity-text">biografía (TEXT)</text>
  <text x="710" y="180" class="entity-text">fecha_nacimiento</text>
  <text x="710" y="195" class="entity-text">nacionalidad</text>
  <text x="710" y="210" class="entity-text">created_at, updated_at</text>

  <!-- TABLA: FORMATOS -->
  <rect x="1000" y="80" width="180" height="100" class="entity-box"/>
  <rect x="1000" y="80" width="180" height="25" fill="#0277bd"/>
  <text x="1090" y="100" style="fill: white; font-weight: bold; text-anchor: middle; font-size: 13px;">FORMATOS</text>
  <text x="1010" y="120" class="pk-indicator">🔑 id_formato (INT)</text>
  <text x="1010" y="135" class="entity-text">nombre (VARCHAR) UK</text>
  <text x="1010" y="150" class="entity-text">descripción (TEXT)</text>
  <text x="1010" y="165" class="entity-text">created_at</text>

  <!-- TABLA: GÉNEROS -->
  <rect x="1200" y="80" width="180" height="100" class="entity-box"/>
  <rect x="1200" y="80" width="180" height="25" fill="#0277bd"/>
  <text x="1290" y="100" style="fill: white; font-weight: bold; text-anchor: middle; font-size: 13px;">GÉNEROS</text>
  <text x="1210" y="120" class="pk-indicator">🔑 id_genero (INT)</text>
  <text x="1210" y="135" class="entity-text">nombre (VARCHAR) UK</text>
  <text x="1210" y="150" class="entity-text">descripción (TEXT)</text>
  <text x="1210" y="165" class="entity-text">created_at</text>

  <!-- TABLA: CATEGORÍAS -->
  <rect x="50" y="280" width="180" height="100" class="entity-box"/>
  <rect x="50" y="280" width="180" height="25" fill="#0277bd"/>
  <text x="140" y="300" style="fill: white; font-weight: bold; text-anchor: middle; font-size: 13px;">CATEGORÍAS</text>
  <text x="60" y="320" class="pk-indicator">🔑 id_categoria (INT)</text>
  <text x="60" y="335" class="entity-text">nombre (VARCHAR) UK</text>
  <text x="60" y="350" class="entity-text">descripción (TEXT)</text>
  <text x="60" y="365" class="entity-text">created_at</text>

  <!-- TABLA: CONCEPTOS -->
  <rect x="1050" y="280" width="180" height="85" class="entity-box"/>
  <rect x="1050" y="280" width="180" height="25" fill="#0277bd"/>
  <text x="1140" y="300" style="fill: white; font-weight: bold; text-anchor: middle; font-size: 13px;">CONCEPTOS</text>
  <text x="1060" y="320" class="pk-indicator">🔑 id_concepto (INT)</text>
  <text x="1060" y="335" class="entity-text">término (VARCHAR) UK</text>
  <text x="1060" y="350" class="entity-text">created_at</text>

  <!-- TABLA: IMAGENES -->
  <rect x="350" y="280" width="220" height="140" class="entity-box"/>
  <rect x="350" y="280" width="220" height="25" fill="#0277bd"/>
  <text x="460" y="300" style="fill: white; font-weight: bold; text-anchor: middle; font-size: 13px;">IMÁGENES</text>
  <text x="360" y="320" class="pk-indicator">🔑 id_imagen (UUID)</text>
  <text x="360" y="335" class="fk-indicator">🔗 id_libro (FK)</text>
  <text x="360" y="350" class="entity-text">nombre_archivo</text>
  <text x="360" y="365" class="entity-text">ruta_archivo</text>
  <text x="360" y="380" class="entity-text">tipo_mime</text>
  <text x="360" y="395" class="entity-text">tamaño_bytes</text>
  <text x="360" y="410" class="entity-text">es_portada, orden</text>

  <!-- TABLA ASOCIATIVA: LIBROS_AUTORES -->
  <rect x="700" y="280" width="200" height="100" class="entity-box"/>
  <rect x="700" y="280" width="200" height="25" fill="#c62828"/>
  <text x="800" y="300" style="fill: white; font-weight: bold; text-anchor: middle; font-size: 12px;">LIBROS_AUTORES</text>
  <text x="710" y="320" class="fk-indicator">🔗 id_libro (FK)</text>
  <text x="710" y="335" class="fk-indicator">🔗 id_autor (FK)</text>
  <text x="710" y="350" class="entity-text">orden_autor (INT)</text>
  <text x="710" y="365" class="entity-text">PK: (id_libro, id_autor)</text>

  <!-- TABLA ASOCIATIVA: LIBROS_GÉNEROS -->
  <rect x="950" y="450" width="200" height="85" class="entity-box"/>
  <rect x="950" y="450" width="200" height="25" fill="#c62828"/>
  <text x="1050" y="470" style="fill: white; font-weight: bold; text-anchor: middle; font-size: 12px;">LIBROS_GÉNEROS</text>
  <text x="960" y="490" class="fk-indicator">🔗 id_libro (FK)</text>
  <text x="960" y="505" class="fk-indicator">🔗 id_genero (FK)</text>
  <text x="960" y="520" class="entity-text">PK: (id_libro, id_genero)</text>

  <!-- TABLA ASOCIATIVA: LIBROS_CONCEPTOS -->
  <rect x="450" y="490" width="220" height="100" class="entity-box"/>
  <rect x="450" y="490" width="220" height="25" fill="#c62828"/>
  <text x="560" y="510" style="fill: white; font-weight: bold; text-anchor: middle; font-size: 12px;">LIBROS_CONCEPTOS</text>
  <text x="460" y="530" class="fk-indicator">🔗 id_libro (FK)</text>
  <text x="460" y="545" class="fk-indicator">🔗 id_concepto (FK)</text>
  <text x="460" y="560" class="entity-text">definición (TEXT)</text>
  <text x="460" y="575" class="entity-text">PK: (id_libro, id_concepto)</text>

  <!-- RELACIONES (Líneas) -->
  <!-- LIBROS -> FORMATOS (1:N) -->
  <line x1="460" y1="220" x2="1090" y2="180" class="relationship" stroke-dasharray="5,5"/>
  <text x="750" y="190" class="relationship-label">1:N</text>

  <!-- LIBROS -> IMAGENES (1:N) -->
  <line x1="460" y1="220" x2="460" y2="280" class="relationship"/>
  <text x="480" y="250" class="relationship-label">1:N</text>

  <!-- LIBROS <-> AUTORES (N:N) -->
  <line x1="570" y1="150" x2="700" y2="150" class="relationship"/>
  <text x="630" y="135" class="relationship-label">N:N</text>

  <!-- LIBROS_AUTORES connections -->
  <line x1="800" y1="280" x2="850" y2="220" class="relationship" stroke-dasharray="5,5"/>
  <line x1="800" y1="280" x2="750" y2="220" class="relationship" stroke-dasharray="5,5"/>

  <!-- LIBROS <-> GÉNEROS (N:N) -->
  <line x1="570" y1="150" x2="1200" y2="150" class="relationship"/>
  <text x="870" y="135" class="relationship-label">N:N</text>

  <!-- LIBROS_GÉNEROS connections -->
  <line x1="1050" y1="450" x2="950" y2="220" class="relationship" stroke-dasharray="5,5"/>

  <!-- LIBROS <-> CONCEPTOS (N:N) -->
  <line x1="570" y1="150" x2="1050" y2="280" class="relationship"/>
  <text x="780" y="200" class="relationship-label">N:N</text>

  <!-- LIBROS_CONCEPTOS connections -->
  <line x1="560" y1="490" x2="510" y2="220" class="relationship" stroke-dasharray="5,5"/>

  <!-- USUARIOS (solo 1 admin) -->
  <line x1="150" y1="220" x2="150" y2="250" class="relationship" stroke-dasharray="5,5"/>
  <text x="170" y="240" class="relationship-label">max 1</text>

  <!-- LEYENDA -->
  <g transform="translate(50, 700)">
    <text x="0" y="0" style="font-size: 16px; font-weight: bold; fill: #0d47a1;">LEYENDA</text>
    
    <rect x="0" y="20" width="15" height="15" fill="#e1f5ff" stroke="#0277bd" stroke-width="1"/>
    <text x="25" y="32" style="font-size: 12px; fill: #333;">Tabla de Datos</text>
    
    <rect x="200" y="20" width="15" height="15" fill="#c62828" stroke="#c62828" stroke-width="1"/>
    <text x="225" y="32" style="font-size: 12px; fill: #333;">Tabla Asociativa (N:N)</text>
    
    <text x="0" y="60" style="font-size: 12px; fill: #333;">🔑 = Clave Primaria (Primary Key)</text>
    <text x="0" y="80" style="font-size: 12px; fill: #333;">🔗 = Clave Foránea (Foreign Key)</text>
    <text x="0" y="100" style="font-size: 12px; fill: #333;">UK = Clave Única (Unique Key)</text>
    <text x="0" y="120" style="font-size: 12px; fill: #333;">Línea sólida = Relación Directa</text>
    <text x="0" y="140" style="font-size: 12px; fill: #333;">Línea punteada = Relación a través de Tabla Asociativa</text>
  </g>

  <!-- RELACIONES Y RESTRICCIONES -->
  <g transform="translate(50, 850)">
    <text x="0" y="0" style="font-size: 14px; font-weight: bold; fill: #0d47a1;">RESTRICCIONES Y CARACTERÍSTICAS</text>
    <text x="0" y="25" style="font-size: 11px; fill: #333;">• Máximo un Administrador en la tabla USUARIOS</text>
    <text x="0" y="42" style="font-size: 11px; fill: #333;">• Un Libro puede tener múltiples Autores, y un Autor puede escribir múltiples Libros</text>
    <text x="0" y="59" style="font-size: 11px; fill: #333;">• Un Libro puede pertenecer a múltiples Géneros, y un Género clasifica múltiples Libros</text>
    <text x="0" y="76" style="font-size: 11px; fill: #333;">• Un Libro puede definir múltiples Conceptos con definiciones específicas por libro</text>
    <text x="550" y="25" style="font-size: 11px; fill: #333;">• Un Libro puede tener múltiples Imágenes, con una portada por libro</text>
    <text x="550" y="42" style="font-size: 11px; fill: #333;">• Un Libro debe tener exactamente un Formato (Catálogo)</text>
    <text x="550" y="59" style="font-size: 11px; fill: #333;">• Todas las fechas se actualizan automáticamente (created_at, updated_at)</text>
    <text x="550" y="76" style="font-size: 11px; fill: #333;">• Diseño en Tercera Forma Normal (3NF) para máxima integridad</text>
  </g>
</svg>
